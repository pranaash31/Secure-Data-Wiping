name: Build Native Installers & Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Build Multi-Platform Native Installers via Matrix
  # ============================================================================
  build-installers:
    name: Package Native Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_pattern: 'dist/*.dmg'
            artifact_name: 'USBSanitizer-macOS-dmg'
          - os: ubuntu-latest
            artifact_pattern: 'dist/*.deb'
            artifact_name: 'USBSanitizer-Linux-deb'
          - os: windows-latest
            artifact_pattern: 'dist/*.msi'
            artifact_name: 'USBSanitizer-Windows-msi'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Build Shaded Uber-JAR
        working-directory: DataWiping
        run: mvn clean package -DskipTests=true --batch-mode

      - name: Build Native Installer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/package-mac.sh
          ./packaging/package-mac.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Build Native Installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot alien
          chmod +x packaging/package-linux.sh
          ./packaging/package-linux.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Build Native Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\packaging\package-win.ps1 -AppVersion "${{ steps.get_version.outputs.VERSION }}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 2. Build Standalone Cross-Platform Shaded Uber-JAR
  # ============================================================================
  build-uber-jar:
    name: Build Standalone Uber-JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Full Shaded JAR
        working-directory: DataWiping
        run: mvn clean package -DskipTests=true --batch-mode

      - name: Upload Uber-JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBSanitizer-Standalone-Jar
          path: DataWiping/target/usb-sanitizer-*-all.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 3. Cryptographic Checksum Generation & GitHub Release Publication
  # ============================================================================
  publish-release:
    name: Publish Release & Cryptographic Signatures
    needs: [build-installers, build-uber-jar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ refs/tags/(v.*) ]]; then
            echo "VERSION=${BASH_REMATCH[1]#v}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
            echo "TAG_NAME=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download macOS Installer
        uses: actions/download-artifact@v4
        with:
          name: USBSanitizer-macOS-dmg
          path: release_assets/

      - name: Download Linux Installer
        uses: actions/download-artifact@v4
        with:
          name: USBSanitizer-Linux-deb
          path: release_assets/

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: USBSanitizer-Windows-msi
          path: release_assets/

      - name: Download Standalone Shaded JAR
        uses: actions/download-artifact@v4
        with:
          name: USBSanitizer-Standalone-Jar
          path: release_assets/

      - name: Compute SHA-256 Checksums
        working-directory: release_assets
        run: |
          echo "Generating SHA-256 digests for all release binaries..."
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "USB Sanitizer Release ${{ steps.get_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            release_assets/*
          body: |
            ## 🛡️ USB Sanitizer Enterprise Release ${{ steps.get_version.outputs.TAG_NAME }}
            
            High-Assurance, NIST SP 800-88 Rev. 1 compliant storage erasure and cryptographic sanitization suite.

            ### 📦 Distributable Binaries & Native Installers
            - **macOS Disk Image (`.dmg`)**: Native bundled application for macOS.
            - **Linux Debian Package (`.deb`)**: Native package with desktop menu and launcher integration.
            - **Windows MSI Installer (`.msi`)**: Windows installer with shortcut and UAC elevation support.
            - **Standalone Shaded Uber-JAR (`-all.jar`)**: Cross-platform executable JAR with bundled native bindings.

            ### 🔐 Integrity Verification (SHA-256)
            Verify downloaded release assets against `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### 📜 Compliance & Verification
            - **NIST SP 800-88 Rev. 1** Clear & Purge Overwrite Protocols
            - **DoD 5220.22-M** & **BSI-GS** Multi-Pass Erasure
            - **Ed25519** Digital Signatures & **Tamper-Evident SHA-256 QR Audit Certificates**
            - **FISMA / HIPAA / GDPR** Compliant Inactivity Auto-Lock & Role-Based Access Control
